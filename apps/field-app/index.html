<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>All Star Field</title>
    <!-- viewport-fit=cover so the app paints under the notch and the home
         indicator, which the field CSS already accounts for with its
         safe-area insets. user-scalable=no because pinch zoom on a form a
         rep is one-thumbing at a door is only ever an accident. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#263449" />
    <!-- The app talks to exactly one host and loads everything else from
         itself. Stated here so a compromised dependency cannot quietly send
         a rep's contacts somewhere new. connect-src is rewritten at build
         time from the configured API base. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' %API_BASE% https://localhost capacitor://localhost; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
