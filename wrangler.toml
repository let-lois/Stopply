# API Worker bindings. Secrets are set with `wrangler secret put` and are
# never committed: CF_API_TOKEN, CF_ACCOUNT_ID, CF_ZONE_ID, CRED_MASTER_KEY,
# ANTHROPIC_API_KEY, INGEST_PEPPER.

name = "bi-dashboard-api-worker"
main = "workers/api/src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "CONTROL_DB"
database_name = "letlois-bi-control"
database_id = "dad0859f-6dae-40e2-b61b-a871820e523f"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "letlois-bi-assets"

[[r2_buckets]]
binding = "CSV_BUCKET"
bucket_name = "letlois-bi-csv"

[[kv_namespaces]]
binding = "SESSIONS"
id = "1bc1e97a05fd43edbb98b4768c29fd67"

# Rebrand in progress: stopply.com is the new primary domain. bi.letlois.com
# routes stay live during the transition for existing client tracking
# (/t.js, /ingest). Do not remove them until clients have migrated.
[[routes]]
pattern = "stopply.com/api/*"
zone_name = "stopply.com"
[[routes]]
pattern = "stopply.com/ingest/*"
zone_name = "stopply.com"
[[routes]]
pattern = "stopply.com/t.js"
zone_name = "stopply.com"
[[routes]]
pattern = "stopply.com/t/*.js"
zone_name = "stopply.com"
[[routes]]
pattern = "*.stopply.com/api/*"
zone_name = "stopply.com"
[[routes]]
pattern = "*.stopply.com/ingest/*"
zone_name = "stopply.com"
[[routes]]
pattern = "*.stopply.com/t.js"
zone_name = "stopply.com"
[[routes]]
pattern = "*.stopply.com/t/*.js"
zone_name = "stopply.com"

[[routes]]
pattern = "bi.letlois.com/api/*"
zone_name = "letlois.com"
[[routes]]
pattern = "bi.letlois.com/ingest/*"
zone_name = "letlois.com"
[[routes]]
pattern = "bi.letlois.com/t.js"
zone_name = "letlois.com"
[[routes]]
pattern = "bi.letlois.com/t/*.js"
zone_name = "letlois.com"
[[routes]]
pattern = "*.bi.letlois.com/api/*"
zone_name = "letlois.com"
[[routes]]
pattern = "*.bi.letlois.com/ingest/*"
zone_name = "letlois.com"
[[routes]]
pattern = "*.bi.letlois.com/t.js"
zone_name = "letlois.com"
[[routes]]
pattern = "*.bi.letlois.com/t/*.js"
zone_name = "letlois.com"

[vars]
# Comma-separated: both domains are recognized during the stopply.com
# migration. isAgencyHost()/resolveTenantByHost() in tenantResolver.ts
# split on comma and check each value.
AGENCY_HOST = "stopply.com,bi.letlois.com"
TENANT_HOST_SUFFIX = ".stopply.com,.bi.letlois.com"
