# Cloudflare Pages project configuration.
#
# The account is "All LetLois Domains". The production BI platform lives in a
# different account ("LetLois"), and Worker routes, D1, R2 and KV are all
# account scoped, so nothing here can bind to anything over there. That split
# is why this deploys to a pages.dev hostname rather than a letlois.com
# subdomain.

name = "stopply-platform"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-01"
# nodejs_compat is not enabled: nothing in functions/ imports a node builtin,
# and the crypto it needs is WebCrypto, which workerd has natively.

account_id = "af6cdf4448e16dc7a72f84c3dd7cf7fb"

[[d1_databases]]
binding = "DB"
database_name = "stopply-platform"
database_id = "700412bd-ef39-47b8-8d00-6d0d0aeb0490"

[vars]
# Non-secret. Secrets are set with `wrangler pages secret put` and are never
# written here, never committed, and never read by client-side code:
#
#   CRED_MASTER_KEY   base64 32 bytes, wraps credential_refs.sealed
#   TURNSTILE_SECRET  server half of the Turnstile keypair
#
# TURNSTILE_SITE_KEY is the public half and is deliberately a var, not a
# secret, because the browser has to render with it.
ENVIRONMENT = "production"
