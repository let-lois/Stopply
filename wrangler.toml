# API Worker bindings. Secrets are set with `wrangler secret put` and are
# never committed: CF_API_TOKEN, CF_ACCOUNT_ID, CF_ZONE_ID, CRED_MASTER_KEY,
# ANTHROPIC_API_KEY, INGEST_PEPPER.

name = "bi-dashboard-api-worker"
main = "workers/api/src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
# Pinned explicitly: this Worker's D1/R2/KV bindings below, and the
# bi.letlois.com routes, all live in the LetLois account. Do not point
# this at the All LetLois Domains account (af6cdf4448e16dc7a72f84c3dd7cf7fb).
account_id = "40d6a92830a7cb75278c823f7f1b19a0"

[[d1_databases]]
binding = "CONTROL_DB"
database_name = "letlois-bi-control"
database_id = "dad0859f-6dae-40e2-b61b-a871820e523f"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "letlois-bi-assets"

[[r2_buckets]]
binding = "CSV_BUCKET"
bucket_name = "letlois-bi-csv"

[[kv_namespaces]]
binding = "SESSIONS"
id = "1bc1e97a05fd43edbb98b4768c29fd67"

[[routes]]
pattern = "bi.letlois.com/api/*"
zone_name = "letlois.com"
[[routes]]
pattern = "bi.letlois.com/ingest/*"
zone_name = "letlois.com"
[[routes]]
pattern = "bi.letlois.com/t.js"
zone_name = "letlois.com"
[[routes]]
pattern = "bi.letlois.com/t/*"
zone_name = "letlois.com"
[[routes]]
pattern = "*.bi.letlois.com/api/*"
zone_name = "letlois.com"
[[routes]]
pattern = "*.bi.letlois.com/ingest/*"
zone_name = "letlois.com"
[[routes]]
pattern = "*.bi.letlois.com/t.js"
zone_name = "letlois.com"
[[routes]]
pattern = "*.bi.letlois.com/t/*"
zone_name = "letlois.com"

[vars]
AGENCY_HOST = "bi.letlois.com"
TENANT_HOST_SUFFIX = ".bi.letlois.com"
